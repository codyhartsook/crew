<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crew</title>
<style>
  :root {
    --window: #f2f2f7; --card: #fff; --fill: rgba(116,116,128,0.08);
    --label: rgba(0,0,0,0.88); --label-2: rgba(60,60,67,0.6); --label-3: rgba(60,60,67,0.35);
    --separator: rgba(60,60,67,0.14); --edge: rgba(60,60,67,0.3);
    --orange:#ff9500; --teal:#0fa3b1; --gray:#8e8e93; --violet:#8b5cf6;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --window:#1c1c1e; --card:#2c2c2e; --fill:rgba(118,118,128,0.18);
      --label:rgba(255,255,255,0.92); --label-2:rgba(235,235,245,0.58); --label-3:rgba(235,235,245,0.32);
      --separator:rgba(84,84,88,0.6); --edge:rgba(235,235,245,0.3);
      --orange:#ff9f0a; --teal:#40c8e0; --gray:#98989d; --violet:#c4b5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px; background:var(--window); color:var(--label);
    font:13px/1.45 var(--sans); -webkit-font-smoothing:antialiased;
  }
  header { max-width:1560px; margin:0 auto 12px; }
  h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:-0.022em; }
  .subrow { display:flex; gap:26px; align-items:baseline; margin-top:2px; }
  .sub { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; font-size:12.5px; color:var(--label-2); }
  .room-title { flex:0 0 320px; margin:0 2px; font-size:11.5px; font-weight:600; }
  .cols { display:flex; gap:26px; max-width:1560px; margin:0 auto; align-items:flex-start; }
  .stage { flex:1 1 auto; min-width:0; }
  .graph { position:relative; }
  .rooms { flex:0 0 320px; height:calc(100vh - 135px); min-height:0;
           display:flex; flex-direction:column; }
  #rooms { min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:0 1px 2px; }
  @media (max-width:1100px) {
    .subrow { gap:12px; }
    .room-title { flex-basis:auto; }
    .cols { flex-direction:column; }
    .rooms { flex:none; width:100%; height:70vh; }
  }

  .room { background:var(--card); border-radius:10px; margin-bottom:7px; overflow:hidden;
          box-shadow:0 0 0 0.5px rgba(0,0,0,0.08); }
  .room > summary {
    cursor:pointer; padding:9px 12px; display:flex; align-items:baseline; gap:7px;
    list-style:none; font-size:12px;
  }
  .room > summary::-webkit-details-marker { display:none; }
  .room .caret { color:var(--label-3); font-size:10px; display:inline-block;
                 transition:transform 0.15s ease; }
  .room[open] .caret { transform:rotate(90deg); }
  .room .rname { font-weight:600; font-family:var(--mono); font-size:11px;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .room .rscope { font-size:9.5px; color:var(--label-3); text-transform:uppercase;
                  letter-spacing:0.04em; }
  .room .rcount { margin-left:auto; font-size:10.5px; color:var(--label-3);
                  white-space:nowrap; font-variant-numeric:tabular-nums; }
  .room .rcount b { color:var(--label-2); font-weight:600; }
  .room .ropen { flex:none; border:0; padding:2px; background:none; color:var(--label-3);
                 cursor:pointer; line-height:0; }
  .room .ropen:hover { color:var(--label); }
  .room .ropen:disabled { cursor:wait; opacity:0.45; }
  .room .ropen.failed { color:var(--orange); }
  .room .ropen .licon { stroke:currentColor; }
  .room .rwho { padding:0 12px 8px 27px; font-size:10.5px; color:var(--label-3);
                font-family:var(--mono); }
  .who-name { font-weight:600; }

  .post { padding:7px 12px 7px 27px; font-size:11.5px; box-shadow:inset 0 0.5px 0 var(--separator); }
  .post .pmode { font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;
                 color:var(--label-3); margin-right:6px; }
  .post.open .pmode { color:var(--label); }
  .post .pbody { color:var(--label-2); }
  .post.open .pbody { color:var(--label); }
  .post .pmeta { margin-top:2px; font-size:10px; color:var(--label-3); font-family:var(--mono); }
  .post .answer { margin-top:4px; padding-left:9px; border-left:2px solid var(--separator);
                  color:var(--label-2); }
  .roomsempty { font-size:12px; color:var(--label-3); padding:4px 2px; }

  /* ---- graph ---- */
  svg { display:block; width:100%; height:auto; max-height:calc(100vh - 190px);
        touch-action:none; cursor:grab; }
  svg.panning { cursor:grabbing; }

  /* One faint guide per depth, so the rings read as structure. */
  .guide { fill:none; stroke:var(--separator); stroke-dasharray:2 5; }

  .link { fill:none; stroke:var(--edge); stroke-width:1.4; stroke-opacity:0.75; }
  /* Heavier than the structure it hangs off, in the agent's own colour. */
  .link.agent { stroke-width:2.4; stroke-opacity:0.9; }
  .link.tether { stroke:var(--violet); stroke-dasharray:4 5; stroke-opacity:0.8; }

  /* Structure square, agents round: shape says place or person. */
  .shape { stroke-width:1.25; }
  .shape.folder { fill:color-mix(in srgb, var(--label) 5%, var(--card));
                  stroke:var(--separator); }
  .shape.place { fill:var(--card); stroke:color-mix(in srgb, var(--label) 26%, transparent); }
  .shape.agent { stroke:color-mix(in srgb, var(--label) 26%, transparent); }
  .shape.home { fill:var(--card); stroke:var(--separator); stroke-width:1; }
  .hubtext { font-size:17px; font-weight:650; fill:var(--label); text-anchor:middle;
             pointer-events:none; font-family:var(--mono); }

  /* The ring around an agent is its context window; the arc is what is spent. */
  .gtrack { fill:none; stroke-width:3.2; }
  .gfill { fill:none; stroke-width:3.2; stroke-linecap:butt; }
  .gnone { fill:none; stroke:var(--label-3); stroke-width:1; stroke-dasharray:2 3; }

  .icon { fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
          pointer-events:none; }
  .icon.place { stroke:var(--label-2); }
  .icon.folder { stroke:var(--label-3); }
  .icon.agent { stroke:rgba(0,0,0,0.55); }

  .nlabel, .nsub {
    pointer-events:none; text-anchor:middle; font-family:var(--mono);
    paint-order:stroke; stroke:var(--window); stroke-width:3.2px; stroke-linejoin:round;
  }
  .nlabel { font-size:11px; font-weight:650; fill:var(--label); }
  .nlabel.folder { font-size:10.5px; fill:var(--label-2); font-weight:600; letter-spacing:0.03em; }
  .nsub { font-size:9.5px; fill:var(--label-3); }
  body.no-labels .nlabel, body.no-labels .nsub { display:none; }

  .node { cursor:pointer; }
  .node, .link { transition:opacity 0.12s ease; }
  .dim { opacity:0.15; }
  .node.trail .shape { stroke:var(--label); stroke-width:2.25; }
  .node.owner .shape { stroke:var(--violet); stroke-width:2.5; }
  .node.picked .shape { stroke:var(--label); stroke-width:2.5; }
  .node.waiting .shape { stroke:var(--orange); stroke-width:2.25; }

  /* hover detail */
  .panel {
    position:absolute; top:0; left:0; z-index:3; width:min(370px, 100%);
    background:var(--card); border-radius:10px; padding:10px 12px;
    box-shadow:0 0 0 0.5px rgba(0,0,0,0.12), 0 6px 20px rgba(0,0,0,0.28);
    pointer-events:none;
  }
  .panel[hidden] { display:none; }
  .crumbs { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11px; }
  .crumb { padding:2px 8px; border-radius:5px; background:var(--fill); color:var(--label-2);
           white-space:nowrap; }
  .crumb.last { background:color-mix(in srgb, var(--label) 12%, transparent); color:var(--label);
                font-weight:600; }
  .crumb.sep { background:none; padding:0; color:var(--label-3); }
  .hint { font-size:12px; color:var(--label-3); }

  .roster { margin-top:8px; display:grid; gap:9px; }
  .arow { display:grid; grid-template-columns:1fr auto; gap:3px 8px; font-size:11.5px; }
  .arow .bar { grid-column:1 / -1; }
  .arow .who { font-weight:600; font-family:var(--mono); font-size:11px; }
  .arow .who i { font-style:normal; margin-right:5px; }
  .arow .model { color:var(--label-3); font-family:var(--mono); font-size:10px; grid-column:1; }
  .bar { height:7px; border-radius:4px; background:var(--fill); overflow:hidden; }
  .bar span { display:block; height:100%; border-radius:4px; }
  .bar.claude span { background:var(--orange); }
  .bar.codex span { background:var(--teal); }
  .arow .num { color:var(--label-2); font-variant-numeric:tabular-nums; text-align:right;
               font-size:11px; }
  .arow .unknown { color:var(--label-3); font-style:italic; }

  .openrow { margin-top:8px; font-size:11.5px; color:var(--label-2); }
  .openrow b { color:var(--label); font-weight:600; }

  .controls { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:9px; }
  .opt { display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
         color:var(--label-2); cursor:pointer; }
  .btn { border:0; border-radius:6px; padding:4px 10px; background:var(--fill);
         color:var(--label-2); font:inherit; font-size:11.5px; cursor:pointer;
         text-decoration:none; display:inline-block; }
  .btn:hover { color:var(--label); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; align-items:center;
            margin-top:9px; font-size:11.5px; color:var(--label-2); }
  .litem { display:inline-flex; align-items:center; gap:5px; }
  .litem b { font-weight:500; color:var(--label-2); }
  .licon { width:15px; height:15px; fill:none; stroke:var(--label-2);
           stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .licon.claude { stroke:var(--orange); }
  .licon.codex { stroke:var(--teal); }
</style>
</head>
<body>
<header>
  <h1>crew</h1>
  <div class="subrow">
    <div class="sub" id="sub">Loading…</div>
    <h2 class="room-title">Room activity</h2>
  </div>
  <div class="legend" id="legend"></div>
</header>
<div class="cols">
  <div class="stage">
    <div class="controls">
      <label class="opt"><input type="checkbox" id="opt-usage" checked> Show context usage</label>
      <label class="opt"><input type="checkbox" id="opt-labels" checked> Labels</label>
      <button class="btn" id="reheat" type="button">Reheat</button>
      <button class="btn" id="recentre" type="button">Fit</button>
    </div>
    <div class="graph"><div class="panel" id="panel" hidden></div><svg id="svg"></svg></div>
  </div>
  <aside class="rooms"><div id="rooms"></div></aside>
</div>

<script>
"use strict";

const SVG_NS = "http://www.w3.org/2000/svg";
const params = new URLSearchParams(location.search);
// Same-origin when the registry serves this page; ?api= points it elsewhere.
const API = params.get("api") ?? "";

const TAU = Math.PI * 2;

// One ring per depth: home, folders, places, agents. Ring means role; the
// simulation only picks where on the ring a node sits.
const MIN_GAP = [0, 118, 118, 108];
const MIN_EXTENT = 260;

// Wide enough that everything on the ring fits round it, but no wider: fixed
// radii leave a small fleet as a few nodes lost on a huge circle.
function ringRadii(counts) {
  const rings = [0];
  for (let d = 1; d < MIN_GAP.length; d++) {
    rings.push(Math.max(rings[d - 1] + MIN_GAP[d], (counts[d] * COLLIDE[d]) / Math.PI));
  }
  return rings;
}

let SHOW_USAGE = remembered("crew.usage", "1") === "1";
let SHOW_LABELS = remembered("crew.labels", "1") === "1";

let DATA = { sessions: [], entries: [] };
let VIEW = null;
let SCENE = null;
let SIM = null;
let SIG = "";
let META = null;
const OPEN_ROOMS = new Set();   // rooms the reader has expanded
const KEEP = new Map();         // id -> {x,y,vx,vy}, so a poll does not restart the layout
let PICK = null;                // { node, sessionKey } while something is selected
let HOVER = null;
let TX = { k: 1, x: 0, y: 0 };
let USER_VIEW = false;          // the reader has panned or zoomed; stop refitting
let DRAGGING = 0;               // nodes currently held; the view must hold still
let RAF = 0;

function remembered(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}

function remember(key, value) {
  try { localStorage.setItem(key, value); } catch { /* private mode */ }
}

// ---- data ----

// A poll that finds nothing changed leaves the DOM and the layout alone;
// repainting would drop the hover and reheat the simulation.
function signature(sessions, entries) {
  return JSON.stringify([
    sessions.map((s) => [s.harness + ":" + s.id, s.status, s.alias, s.usage && s.usage.context_used]),
    entries.map((e) => [e.id, e.resolves, e.resolved_by]),
  ]);
}

async function load() {
  // An older registry may not serve /v1/meta; home then falls back to a guess.
  if (META === null) META = await json(API + "/v1/meta").catch(() => ({}));
  const [s, e] = await Promise.all([
    json(API + "/v1/sessions"),
    json(API + "/v1/entries"),
  ]);
  const sessions = s.sessions || [], entries = e.entries || [];
  const sig = signature(sessions, entries);
  if (sig === SIG) return false;
  SIG = sig;
  DATA = { sessions, entries };
  draw();
  return true;
}

async function json(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// A pooled slot's room key is "<root>#<lease>". Position is by path, so the
// lease is stripped for matching.
function roomPath(key) {
  const hash = key.indexOf("#");
  return hash === -1 ? key : key.slice(0, hash);
}

function zonePath(s) {
  return s.repo ? s.repo.root : s.cwd;
}

// The registry reports its own home directory. Guessing from paths is only a
// fallback for static fixtures, and it is a guess: it says so in the header.
function detectHome(paths) {
  if (params.get("home")) return { home: params.get("home"), exact: true };
  if (META && META.home) return { home: META.home, exact: true };
  for (const p of paths) {
    const m = /^(\/(?:Users|home)\/[^/]+)(?:\/|$)/.exec(p);
    if (m) return { home: m[1], exact: false };
  }
  return { home: "/", exact: false };
}

// ---- tree ----

// Two structural levels: the folder chain compressed into one segment, then
// the place. Home is the root, and everything hangs off it.
function buildTree(paths, home) {
  const root = { name: "~", path: home, depth: 0, children: new Map() };
  for (const p of paths) {
    const rel = p.startsWith(home + "/") ? p.slice(home.length + 1) : p.replace(/^\//, "");
    const segs = rel.split("/").filter(Boolean);
    if (!segs.length) continue;

    const place = segs[segs.length - 1];
    const folder = segs.slice(0, -1).join("/");
    let parent = root;
    if (folder) {
      if (!root.children.has(folder)) {
        root.children.set(folder, {
          name: folder, path: home + "/" + folder, depth: 1, role: "folder",
          children: new Map(), parent: root,
        });
      }
      parent = root.children.get(folder);
    }
    if (!parent.children.has(place)) {
      parent.children.set(place, {
        name: place, path: p, depth: 2, role: "place",
        children: new Map(), parent,
      });
    }
  }
  return root;
}

function flatten(node, out = []) {
  out.push(node);
  for (const k of node.children.values()) flatten(k, out);
  return out;
}

// An angular slot per node, weighted by leaf count, used as the starting
// position only. Seeding any other way scatters siblings and the links settle
// into a tangle they cannot undo.
function assignAngles(node, start, span) {
  node.a0 = start;
  node.a1 = start + span;
  const kids = [...node.children.values()].sort((a, b) => a.name.localeCompare(b.name));
  const leaves = kids.map(countLeaves);
  const total = leaves.reduce((a, b) => a + b, 0) || 1;
  let at = start;
  kids.forEach((kid, i) => {
    const w = (leaves[i] / total) * span;
    assignAngles(kid, at, w);
    at += w;
  });
}

function countLeaves(node) {
  if (!node.children.size) return 1;
  return [...node.children.values()].reduce((n, k) => n + countLeaves(k), 0);
}

const polar = (r, a) => [r * Math.cos(a - Math.PI / 2), r * Math.sin(a - Math.PI / 2)];

// ---- icons ----
// 16x16 stroke glyphs, drawn inline so the page needs no icon font.
const ICONS = {
  folder: [["path", { d: "M2 4.6a1 1 0 0 1 1-1h3.1l1.4 1.7H13a1 1 0 0 1 1 1v5.9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" }]],
  repo: [
    ["path", { d: "M4.4 2.6H12a.6.6 0 0 1 .6.6v9.5a.6.6 0 0 1-.6.6H4.4A1.4 1.4 0 0 1 3 11.9V4A1.4 1.4 0 0 1 4.4 2.6z" }],
    ["path", { d: "M3.2 11.3h9.4" }],
  ],
  worktree: [
    ["circle", { cx: 5, cy: 3.9, r: 1.8 }],
    ["circle", { cx: 5, cy: 12.1, r: 1.8 }],
    ["circle", { cx: 11.2, cy: 3.9, r: 1.8 }],
    ["path", { d: "M5 5.7v4.6" }],
    ["path", { d: "M11.2 5.7v1.1c0 1.6-1.3 2.9-2.9 2.9H6.9" }],
  ],
  pool: [
    ["path", { d: "M8 2.6 13.8 5.8 8 9 2.2 5.8z" }],
    ["path", { d: "M2.2 9.3 8 12.5l5.8-3.2" }],
  ],
  dir: [["path", { d: "M2 4.6a1 1 0 0 1 1-1h3.1l1.4 1.7H13a1 1 0 0 1 1 1v5.9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" }]],
  agent: [
    ["circle", { cx: 8, cy: 5.7, r: 2.5 }],
    ["path", { d: "M3.4 13.5a4.6 4.6 0 0 1 9.2 0" }],
  ],
};

function glyph(kind, size, cls) {
  const shapes = ICONS[kind] || ICONS.dir;
  const k = size / 16;
  const g = el("g", { class: "icon " + cls, transform: "scale(" + k + ") translate(-8,-8)" });
  for (const [name, attrs] of shapes) g.append(el(name, attrs));
  return g;
}

// ---- graph model ----
//
// Radius is the drawn size; collide adds room for the label.
const KIND = {
  home:     { r: 42, collide: 66, icon: null,       square: false, rx: 0 },
  folder:   { r: 21, collide: 49, icon: "folder",   square: true,  rx: 10 },
  repo:     { r: 18, collide: 45, icon: "repo",     square: true,  rx: 8 },
  worktree: { r: 18, collide: 45, icon: "worktree", square: true,  rx: 8 },
  pool:     { r: 18, collide: 45, icon: "pool",     square: true,  rx: 8 },
  dir:      { r: 18, collide: 45, icon: "dir",      square: true,  rx: 8 },
  agent:    { r: 16, collide: 41, icon: "agent",    square: false, rx: 0 },
};

// Collide radius of whatever sits on each ring, for sizing it.
const COLLIDE = [0, KIND.folder.collide, KIND.repo.collide, KIND.agent.collide];

function buildGraph() {
  const sessions = DATA.sessions.filter((s) => s.status === "active");
  const entries = DATA.entries;

  const paths = new Set();
  for (const s of sessions) paths.add(zonePath(s));
  for (const e of entries) paths.add(roomPath(e.room));

  const { home, exact: homeExact } = detectHome([...paths]);
  const root = buildTree([...paths], home);
  assignAngles(root, 0, TAU);
  const zones = flatten(root).filter((n) => n.depth > 0);
  const byPath = new Map(zones.map((n) => [n.path, n]));
  byPath.set(root.path, root);

  const agentsAt = new Map();
  for (const s of sessions) {
    const p = zonePath(s);
    if (!agentsAt.has(p)) agentsAt.set(p, []);
    agentsAt.get(p).push(s);
  }
  const openAt = new Map(), entriesAt = new Map();
  for (const e of entries) {
    const p = roomPath(e.room);
    if (!entriesAt.has(p)) entriesAt.set(p, []);
    entriesAt.get(p).push(e);
    if (isOpen(e)) openAt.set(p, (openAt.get(p) || 0) + 1);
  }

  const waiting = new Map();
  for (const e of entries) {
    if (!e.to || !isOpen(e)) continue;
    waiting.set(e.to, e);
  }

  for (const n of zones) n.kind = n.role === "folder" ? "folder" : "repo";
  for (const sess of sessions) {
    const n = byPath.get(zonePath(sess));
    if (!n || n.children.size) continue;
    n.kind = !sess.repo ? "dir" : sess.repo.is_worktree ? "worktree" : "repo";
    n.owner = sess.pool && sess.repo ? sess.repo.main_root : null;
    n.branch = sess.repo ? sess.repo.branch : "";

    // A pooled checkout sits at <pool>/<slot>/<repo>, so the folder above it is
    // the slot the manager lent out. The session says which; the path only
    // spells it, and reads as a bare number.
    if (sess.pool && n.parent.role === "folder") {
      n.parent.glyph = "pool";
      n.parent.label = sess.pool.name;
      n.parent.sub = sess.pool.manager + " · slot " + sess.pool.slot;
    }
  }

  root.kind = "home";
  root.zone = root;
  root.id = "z:" + root.path;
  Object.assign(root, KIND.home);
  const nodes = [root], links = [];
  for (const n of zones) {
    n.id = "z:" + n.path;
    n.zone = n;
    Object.assign(n, KIND[n.kind] || KIND.dir);
    nodes.push(n);
    links.push({ source: n.parent, target: n, kind: "structure" });
  }

  const palette = assignColours(sessions);
  for (const [path, here] of agentsAt) {
    // An agent sitting in home itself has no place of its own; it hangs off
    // the centre.
    const place = byPath.get(path) || root;
    const span = (place.a1 - place.a0) / here.length;
    here.forEach((sess, i) => {
      const key = sess.harness + ":" + sess.id;
      const node = Object.assign({
        id: "a:" + key, key, sess, kind: "agent", role: "agent",
        name: sess.alias || sess.harness, path: place.path,
        parent: place, zone: place, depth: 3,
        a0: place.a0 + i * span, a1: place.a0 + (i + 1) * span,
        children: new Map(), colour: palette.get(key) || "var(--gray)",
      }, KIND.agent);
      nodes.push(node);
      links.push({ source: place, target: node, kind: "agent", colour: node.colour });
    });
  }

  const counts = [0, 0, 0, 0];
  for (const n of nodes) if (n.depth) counts[n.depth]++;
  const rings = ringRadii(counts);
  for (const n of nodes) {
    n.ring = rings[n.depth];
    n.ringPull = n.kind === "agent" ? 0.5 : 0.65;
  }

  // A pooled slot lives where it sits on disk; the tether says what owns it.
  for (const n of zones) {
    const own = n.owner ? byPath.get(n.owner) : null;
    if (own) links.push({ source: own, target: n, kind: "tether" });
  }

  // Re-bind the selection to the new graph; drop it if its zone or agent is gone.
  if (PICK) {
    const node = byPath.get(PICK.node.path);
    const here = node ? agentsAt.get(node.path) || [] : [];
    const alive = !PICK.sessionKey || here.some((x) => x.harness + ":" + x.id === PICK.sessionKey);
    PICK = node && alive ? { node, sessionKey: PICK.sessionKey } : null;
  }

  VIEW = {
    root, nodes, links, byPath, zones, sessions, entries, agentsAt, entriesAt, openAt,
    authors: new Map(sessions.map((x) => [x.harness + ":" + x.id, x.alias])),
    palette, openTotal: entries.filter(isOpen).length, home, homeExact,
    total: sessions.length, waiting,
  };
}

// ---- force simulation ----
//
// d3's link, many-body and collide, plus radial in place of the example's x
// and y: home is pinned at the origin, everything else pulled to its ring.
//
// Written out rather than fetched: the page must work offline. Many-body is
// the naive O(n^2) pass, since a fleet is tens of nodes.

const JIGGLE = () => (Math.random() - 0.5) * 1e-6;

function createSim(nodes, links) {
  const sim = {
    nodes, links,
    alpha: 1, alphaMin: 0.001, alphaTarget: 0,
    alphaDecay: 1 - Math.pow(0.001, 1 / 300), velocityDecay: 0.6,
  };
  placeNodes(nodes);
  prepareLinks(links);
  // Modest: many-body is global, so raising it inflates every link at once.
  // Separation along a ring is collide's job.
  for (const n of nodes) n.charge = -(110 + n.r * 7);
  return sim;
}

// Seeded on its own ring at its assigned angle, so the first frame is already
// the right shape. Home is the fixed centre.
function placeNodes(nodes) {
  for (const n of nodes) {
    const kept = KEEP.get(n.id);
    if (kept) {
      n.x = kept.x; n.y = kept.y; n.vx = kept.vx; n.vy = kept.vy;
    } else {
      [n.x, n.y] = polar(n.ring, (n.a0 + n.a1) / 2);
      n.vx = 0; n.vy = 0;
    }
    n.fx = null; n.fy = null;
  }
  nodes[0].x = 0; nodes[0].y = 0; nodes[0].fx = 0; nodes[0].fy = 0;
}

function prepareLinks(links) {
  const count = new Map();
  const bump = (n) => count.set(n.id, (count.get(n.id) || 0) + 1);
  for (const l of links) { bump(l.source); bump(l.target); }
  for (const l of links) {
    const cs = count.get(l.source.id), ct = count.get(l.target.id);
    l.bias = cs / (cs + ct);
    // d3's default: a link into a busy node pulls proportionally less.
    l.strength = l.kind === "tether" ? 0.1 : 1 / Math.min(cs, ct);
    // The gap between the two rings, so links agree with the radial force
    // rather than fight it.
    l.distance = l.kind === "tether" ? 230 : Math.abs(l.target.ring - l.source.ring);
  }
}

function tick(sim) {
  sim.alpha += (sim.alphaTarget - sim.alpha) * sim.alphaDecay;
  const a = sim.alpha;
  forceLink(sim, a);
  forceCharge(sim, a);
  forceRadial(sim, a);
  forceCollide(sim);
  for (const n of sim.nodes) {
    if (n.fx == null) n.x += (n.vx *= sim.velocityDecay);
    else { n.x = n.fx; n.vx = 0; }
    if (n.fy == null) n.y += (n.vy *= sim.velocityDecay);
    else { n.y = n.fy; n.vy = 0; }
  }
}

function forceLink(sim, alpha) {
  for (const l of sim.links) {
    const s = l.source, t = l.target;
    let x = t.x + t.vx - s.x - s.vx || JIGGLE();
    let y = t.y + t.vy - s.y - s.vy || JIGGLE();
    let d = Math.sqrt(x * x + y * y);
    d = ((d - l.distance) / d) * alpha * l.strength;
    x *= d; y *= d;
    let b = l.bias;
    t.vx -= x * b; t.vy -= y * b;
    b = 1 - b;
    s.vx += x * b; s.vy += y * b;
  }
}

function forceCharge(sim, alpha) {
  const nodes = sim.nodes;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const o = nodes[j];
      const x = o.x - n.x || JIGGLE();
      const y = o.y - n.y || JIGGLE();
      let l = x * x + y * y;
      if (l < 1) l = Math.sqrt(l);   // d3's distanceMin of 1, squared
      const w = (o.charge * alpha) / l;
      n.vx += x * w; n.vy += y * w;
    }
  }
}

// Each node is pulled onto the ring for its depth. This is what makes the
// layout circular; the other forces only choose where on the ring it sits.
function forceRadial(sim, alpha) {
  for (const n of sim.nodes) {
    if (!n.ring) continue;
    const dx = n.x || 1e-6, dy = n.y || 1e-6;
    const r = Math.sqrt(dx * dx + dy * dy);
    const k = ((n.ring - r) * n.ringPull * alpha) / r;
    n.vx += dx * k;
    n.vy += dy * k;
  }
}

function forceCollide(sim) {
  const nodes = sim.nodes, strength = 0.9;
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i], ri = n.collide, ri2 = ri * ri;
      for (let j = i + 1; j < nodes.length; j++) {
        const o = nodes[j];
        let rj = o.collide;
        const r = ri + rj;
        let x = n.x + n.vx - o.x - o.vx;
        let y = n.y + n.vy - o.y - o.vy;
        let l = x * x + y * y;
        if (l >= r * r) continue;
        if (x === 0) { x = JIGGLE(); l += x * x; }
        if (y === 0) { y = JIGGLE(); l += y * y; }
        l = ((r - (l = Math.sqrt(l))) / l) * strength;
        rj *= rj;
        let share = rj / (ri2 + rj);
        n.vx += (x *= l) * share;
        n.vy += (y *= l) * share;
        share = 1 - share;
        o.vx -= x * share;
        o.vy -= y * share;
      }
    }
  }
}

function reheat(target) {
  if (!SIM) return;
  SIM.alpha = Math.max(SIM.alpha, target);
  run();
}

function run() {
  if (RAF) return;
  // A hidden tab gets no animation frames, so settle in one go instead.
  if (document.hidden) { settle(); return; }
  const step = () => {
    RAF = 0;
    if (!SIM) return;
    tick(SIM);
    fitView();
    place();
    if (SIM.alpha >= SIM.alphaMin || SIM.alphaTarget > 0) RAF = requestAnimationFrame(step);
    else keepPositions();
  };
  RAF = requestAnimationFrame(step);
}

function settle() {
  if (!SIM) return;
  // alphaDecay is set so alpha reaches alphaMin in 300 ticks; the guard is
  // only there so a future change to the decay cannot spin forever.
  for (let i = 0; i < 400 && SIM.alpha >= SIM.alphaMin; i++) tick(SIM);
  fitView();
  place();
  keepPositions();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) run();
});

// The next poll rebuilds the nodes, so positions carry across by id;
// otherwise the graph jumps whenever a token count ticks over.
function keepPositions() {
  if (!SIM) return;
  KEEP.clear();
  for (const n of SIM.nodes) KEEP.set(n.id, { x: n.x, y: n.y, vx: n.vx, vy: n.vy });
}

// ---- render ----

function draw() {
  keepPositions();
  const cold = KEEP.size === 0;
  buildGraph();
  SIM = createSim(VIEW.nodes, VIEW.links);
  scene();
  place();
  // A first paint settles from cold; a later one only has to absorb whatever
  // just arrived or left.
  SIM.alpha = cold ? 1 : 0.4;
  run();
  resetPanel();
  header();
  renderRooms();
}

function scene() {
  const svg = document.getElementById("svg");
  svg.replaceChildren();

  const root = el("g");
  const guideLayer = el("g");
  const linkLayer = el("g");
  const nodeLayer = el("g");
  root.append(guideLayer, linkLayer, nodeLayer);
  svg.append(root);

  for (const r of new Set(VIEW.nodes.map((n) => n.ring))) {
    if (r) guideLayer.append(el("circle", { class: "guide", r }));
  }

  const linkEls = VIEW.links.map((l) => {
    const line = el("line", { class: "link " + l.kind });
    if (l.colour) line.setAttribute("stroke", l.colour);
    line.dataset.source = l.source.id;
    line.dataset.target = l.target.id;
    linkLayer.append(line);
    return line;
  });

  const nodeEls = VIEW.nodes.map(nodeElement);
  for (const g of nodeEls) nodeLayer.append(g);

  SCENE = { svg, root, linkEls, nodeEls };
  fitView();
  applyTransform();
}

function nodeElement(n) {
  const g = el("g", { class: "node" });
  g.dataset.id = n.id;
  g.dataset.zone = n.zone.path;
  g.dataset.kind = n.kind;
  if (n.key) g.dataset.key = n.key;

  if (n.kind === "home") {
    const dir = VIEW.home.split("/").filter(Boolean).pop() || VIEW.home;
    g.append(el("circle", { class: "shape home", r: n.r }));
    g.append(el("text", { class: "hubtext", y: 6 }, "~"));
    // Sits alone in the middle, so it can carry a longer name than the rim.
    g.append(el("text", { class: "nlabel", y: n.r + 15 }, fit(dir, 24)));
    g.append(el("text", { class: "nsub", y: n.r + 26 },
      VIEW.total + (VIEW.total === 1 ? " agent" : " agents")));
    g.append(el("title", {}, n.path));
    wire(g, n);
    return g;
  }

  if (n.square) {
    g.append(el("rect", {
      class: "shape " + (n.kind === "folder" ? "folder" : "place"),
      x: -n.r, y: -n.r, width: n.r * 2, height: n.r * 2, rx: n.rx,
    }));
  } else {
    g.append(el("circle", { class: "shape agent", r: n.r, fill: n.colour }));
    g.append(gauge(n));
  }

  const plain = n.kind === "folder" && !n.glyph;
  const size = n.kind === "folder" ? 19 : n.kind === "agent" ? 16 : 18;
  const cls = plain ? "folder" : n.kind === "agent" ? "agent" : "place";
  g.append(glyph(n.glyph || n.icon, size, cls));

  // Kept short: collide is circular, so a name wider than the node's own
  // footprint is the one thing the layout cannot pull apart.
  g.append(el("text", {
    class: "nlabel" + (plain ? " folder" : ""), y: n.r + 14,
  }, fit(n.label || shortName(n.name), 17)));

  const sub = subtitle(n);
  if (sub) g.append(el("text", { class: "nsub", y: n.r + 25 }, fit(sub, 19)));

  g.append(el("title", {}, tooltip(n)));
  wire(g, n);
  return g;
}

// The ring is the context window and the arc is what has been spent - the same
// reading the ring view gives an agent's band, wrapped around the node.
function gauge(n) {
  const u = n.sess.usage || {};
  const known = u.context_window > 0 && u.context_used > 0;
  const r = n.r + 4.6;
  if (!known) return el("circle", { class: "gnone", r });
  if (!SHOW_USAGE) return el("g");

  const frac = Math.min(1, u.context_used / u.context_window);
  const c = 2 * Math.PI * r;
  const wrap = el("g", { transform: "rotate(-90)" });
  wrap.append(el("circle", {
    class: "gtrack", r,
    stroke: "color-mix(in srgb, " + n.colour + " 34%, var(--window))",
  }));
  wrap.append(el("circle", {
    class: "gfill", r, stroke: n.colour,
    "stroke-dasharray": (c * frac).toFixed(2) + " " + c.toFixed(2),
  }));
  return wrap;
}

function subtitle(n) {
  if (n.kind === "agent") {
    const u = n.sess.usage || {};
    const model = shortModel(u.model || (n.sess.meta && n.sess.meta.model) || n.sess.harness);
    const known = u.context_window > 0 && u.context_used > 0;
    if (!SHOW_USAGE || !known) return model;
    return model + " · " + Math.round((u.context_used / u.context_window) * 100) + "%";
  }
  if (n.sub) return n.sub;
  if (n.branch) return n.branch;
  const here = (VIEW.agentsAt.get(n.path) || []).length;
  return here ? here + (here === 1 ? " agent" : " agents") : "";
}

function tooltip(n) {
  if (n.kind !== "agent") return n.path;
  const u = n.sess.usage || {};
  const model = u.model || (n.sess.meta && n.sess.meta.model) || n.sess.harness;
  return n.name + " · " + model + "\n" + n.path;
}

function place() {
  if (!SCENE) return;
  for (let i = 0; i < SCENE.linkEls.length; i++) {
    const l = VIEW.links[i], e = SCENE.linkEls[i];
    e.setAttribute("x1", l.source.x); e.setAttribute("y1", l.source.y);
    e.setAttribute("x2", l.target.x); e.setAttribute("y2", l.target.y);
  }
  for (let i = 0; i < SCENE.nodeEls.length; i++) {
    const n = VIEW.nodes[i];
    SCENE.nodeEls[i].setAttribute("transform", "translate(" + n.x + "," + n.y + ")");
  }
}

function header() {
  document.getElementById("sub").textContent =
    VIEW.total + " agents · " + VIEW.agentsAt.size + " zones · " +
    (VIEW.openTotal ? VIEW.openTotal + " open · " : "") +
    "home " + VIEW.home + (VIEW.homeExact ? "" : " (inferred)");
}

function applyTransform() {
  if (!SCENE) return;
  SCENE.root.setAttribute("transform",
    "translate(" + TX.x + "," + TX.y + ") scale(" + TX.k + ")");
}

// Home is pinned at the origin, so framing is just a square viewBox wide
// enough for the outermost label. A pan or zoom freezes it.
function fitView() {
  if (USER_VIEW || DRAGGING || !VIEW || !VIEW.nodes.length || !SCENE) return;
  let ext = MIN_EXTENT;
  for (const n of VIEW.nodes) ext = Math.max(ext, Math.hypot(n.x, n.y) + n.r + 36);
  SCENE.svg.setAttribute("viewBox", -ext + " " + -ext + " " + ext * 2 + " " + ext * 2);
}

// Collapsed folder names get long, so only the tail is shown - but a tail like
// "6" names nothing on its own, so a short or numeric one keeps its parent.
function shortName(name) {
  if (name.length <= 16) return name;
  const segs = name.split("/");
  const last = segs[segs.length - 1];
  if (segs.length > 1 && (last.length <= 3 || /^\d+$/.test(last))) {
    return segs[segs.length - 2] + "/" + last;
  }
  return last;
}

function fit(text, chars) {
  if (!text) return "";
  return text.length <= chars ? text : text.slice(0, chars - 1) + "…";
}

// ---- agent colour ----
//
// Identity is the hue, assigned by stable order so it survives a refresh.
function assignColours(sessions) {
  const ordered = [...sessions].sort((a, b) =>
    (a.harness + a.id).localeCompare(b.harness + b.id));
  const steps = ordered.length || 1;
  const agents = new Map();
  // The trailing sample is dropped: rainbow is cyclic, so 1 repeats 0.
  ordered.forEach((sess, i) =>
    agents.set(sess.harness + ":" + sess.id, lighten(rainbow(i / steps), 0.34)));
  return agents;
}

// Shades within a family, by mixing toward white.
function lighten(colour, f) {
  const parts = colour.match(/\d+/g);
  if (!parts || f <= 0) return colour;
  const [r, g, b] = parts.map(Number);
  const up = (c) => Math.round(c + (255 - c) * f);
  return "rgb(" + up(r) + "," + up(g) + "," + up(b) + ")";
}

// d3.interpolateRainbow, reimplemented. Cubehelix, not a plain hue sweep:
// lightness and saturation ride with the hue.
const CH = { A: -0.14861, B: 1.78277, C: -0.29227, D: -0.90649, E: 1.97294 };

function cubehelix(h, s, l) {
  const rad = ((h + 120) * Math.PI) / 180;
  const a = s * l * (1 - l);
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const byte = (x) => Math.max(0, Math.min(255, Math.round(255 * x)));
  return "rgb(" + byte(l + a * (CH.A * cos + CH.B * sin)) + "," +
                  byte(l + a * (CH.C * cos + CH.D * sin)) + "," +
                  byte(l + a * (CH.E * cos)) + ")";
}

function rainbow(t) {
  t -= Math.floor(t);
  const ts = Math.abs(t - 0.5);
  return cubehelix(360 * t - 100, 1.5 - 1.5 * ts, 0.8 - 0.9 * ts);
}

function colourOf(key) {
  return (VIEW && VIEW.palette.get(key)) || "var(--gray)";
}

// ---- interaction ----

// The example's drag, plus: a press that never moved is a click, so one
// gesture both drags and selects.
function wire(g, n) {
  let moved = false, dragging = false;

  g.addEventListener("pointerenter", () => {
    HOVER = n;
    highlight(n.zone, n.key || null);
  });
  g.addEventListener("pointerleave", () => {
    if (HOVER === n) HOVER = null;
    resetPanel();
  });

  // Home is the origin the rings are measured from; dragging it would move
  // every ring with it.
  if (n.kind === "home") {
    g.addEventListener("click", () => pick(n, null));
    return;
  }

  g.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.stopPropagation();
    g.setPointerCapture(ev.pointerId);
    dragging = true; moved = false; DRAGGING++;
    const [x, y] = toGraph(ev);
    n.fx = x; n.fy = y;
    if (SIM) { SIM.alphaTarget = 0.3; reheat(0.3); }
  });

  g.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    moved = true;
    const [x, y] = toGraph(ev);
    n.fx = x; n.fy = y;
  });

  const release = (ev) => {
    if (!dragging) return;
    dragging = false; DRAGGING--;
    g.releasePointerCapture(ev.pointerId);
    if (SIM) SIM.alphaTarget = 0;
    n.fx = null; n.fy = null;
    if (!moved) pick(n.zone, n.key || null);
  };
  g.addEventListener("pointerup", release);
  g.addEventListener("pointercancel", release);
}

function toGraph(ev) {
  const m = SCENE.root.getScreenCTM();
  if (!m) return [0, 0];
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
  return [p.x, p.y];
}

function initStage() {
  const svg = document.getElementById("svg");

  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    if (!SCENE) return;
    const m = svg.getScreenCTM();
    if (!m) return;
    // Zoom about the cursor: take the pointer into viewBox units, then solve
    // for the translation that leaves that point where it already was.
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
    const k = Math.max(0.25, Math.min(4, TX.k * Math.pow(2, -ev.deltaY * 0.002)));
    TX.x = p.x - ((p.x - TX.x) / TX.k) * k;
    TX.y = p.y - ((p.y - TX.y) / TX.k) * k;
    TX.k = k;
    USER_VIEW = true;
    applyTransform();
  }, { passive: false });

  let panning = null;
  svg.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    panning = { x: ev.clientX, y: ev.clientY, tx: TX.x, ty: TX.y, moved: false };
    svg.setPointerCapture(ev.pointerId);
    svg.classList.add("panning");
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!panning) return;
    // Both ends through the same inverse, so the drag tracks the cursor at
    // whatever size the viewBox happens to be.
    const m = svg.getScreenCTM();
    if (!m) return;
    const inv = m.inverse();
    const a = new DOMPoint(panning.x, panning.y).matrixTransform(inv);
    const b = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(inv);
    TX.x = panning.tx + (b.x - a.x);
    TX.y = panning.ty + (b.y - a.y);
    if (Math.abs(ev.clientX - panning.x) + Math.abs(ev.clientY - panning.y) > 3) {
      panning.moved = true;
      USER_VIEW = true;
    }
    applyTransform();
  });
  const stop = (ev) => {
    if (!panning) return;
    const clean = !panning.moved;
    panning = null;
    svg.releasePointerCapture(ev.pointerId);
    svg.classList.remove("panning");
    if (clean && PICK) { PICK = null; repaintPicks(); resetPanel(); }
  };
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);
}

function recentre() {
  USER_VIEW = false;
  TX = { k: 1, x: 0, y: 0 };
  applyTransform();
  fitView();
}

// ---- hover detail ----

function ancestors(n) {
  const chain = [];
  for (let cur = n; cur; cur = cur.parent) chain.unshift(cur);
  return chain;
}

// Dimming everything off the ancestor chain is what makes ownership legible.
function highlight(zone, sessionKey) {
  if (!SCENE) return;
  const chain = new Set(ancestors(zone).map((n) => n.path));
  const owner = zone.owner ? VIEW.byPath.get(zone.owner) : null;

  const lit = new Set();
  for (const n of VIEW.nodes) {
    const on = n.kind === "agent"
      ? n.zone.path === zone.path && (!sessionKey || n.key === sessionKey)
      : chain.has(n.path) || (!!owner && n.path === owner.path);
    if (on) lit.add(n.id);
  }

  for (const g of SCENE.nodeEls) {
    const id = g.dataset.id;
    g.classList.toggle("dim", !lit.has(id));
    g.classList.toggle("trail", id === "z:" + zone.path);
    g.classList.toggle("owner", !!owner && id === "z:" + owner.path);
  }
  for (const e of SCENE.linkEls) {
    e.classList.toggle("dim", !(lit.has(e.dataset.source) && lit.has(e.dataset.target)));
  }
  renderPanel(zone, sessionKey);
}

function pick(zone, sessionKey) {
  const same = PICK && PICK.node === zone && PICK.sessionKey === sessionKey;
  PICK = same ? null : { node: zone, sessionKey };
  repaintPicks();
  resetPanel();
}

function repaintPicks() {
  if (!SCENE) return;
  for (const g of SCENE.nodeEls) {
    const isPick = !!PICK && (PICK.sessionKey
      ? g.dataset.key === PICK.sessionKey
      : g.dataset.id === "z:" + PICK.node.path);
    g.classList.toggle("picked", isPick);
  }
}

// An agent someone is waiting on is the one thing worth seeing without hovering.
function markWaiting() {
  if (!SCENE) return;
  for (const g of SCENE.nodeEls) {
    g.classList.toggle("waiting", !!g.dataset.key && VIEW.waiting.has(g.dataset.key));
  }
}

function resetPanel() {
  if (SCENE) {
    for (const e of SCENE.nodeEls) e.classList.remove("dim", "trail", "owner");
    for (const e of SCENE.linkEls) e.classList.remove("dim");
  }
  markWaiting();
  if (PICK) { highlight(PICK.node, PICK.sessionKey); return; }
  document.getElementById("panel").hidden = true;
}

function renderPanel(node, sessionKey) {
  const panel = document.getElementById("panel");
  panel.hidden = false;
  const crumbs = tag("div", "crumbs");
  const chain = ancestors(node);
  chain.forEach((n, i) => {
    const last = i === chain.length - 1;
    const chip = tag("span", "crumb" + (last ? " last" : ""), elide(n.label || n.name));
    chip.title = n.path;
    crumbs.append(chip);
    if (!last) crumbs.append(tag("span", "crumb sep", "›"));
  });

  const agents = VIEW.agentsAt.get(node.path) || [];
  const roster = tag("div", "roster");
  for (const s of agents) {
    roster.append(agentRow(s, sessionKey === s.harness + ":" + s.id));
  }
  panel.replaceChildren(crumbs);
  if (agents.length) panel.append(roster);
  else panel.append(tag("div", "hint", "No agents here."));

  if (node.owner) {
    const own = VIEW.byPath.get(node.owner);
    panel.append(tag("div", "openrow",
      "Leased slot of " + (own ? own.name : node.owner.replace(VIEW.home, "~"))));
  }
  for (const s2 of agents) {
    const asked = VIEW.waiting.get(s2.harness + ":" + s2.id);
    if (!asked) continue;
    const from = VIEW.sessions.find((x) => x.harness + ":" + x.id === asked.author);
    panel.append(tag("div", "openrow",
      s2.alias + " is awaiting a reply to " + (from ? from.alias : asked.author) +
      ": " + asked.body));
  }

  const open = (VIEW.entriesAt.get(node.path) || []).filter((e) => isOpen(e) && !e.to);
  if (open.length) {
    const row = tag("div", "openrow");
    row.append(tag("b", "", open.length + " open: "),
      document.createTextNode(open.map((e) => e.body).join(" · ")));
    panel.append(row);
  }
}

// A crumb names a place; the full path is on the node's own tooltip.
function elide(name, max = 13) {
  if (name.length <= max) return name;
  const parts = name.split("/");
  if (parts.length > 1) {
    const head = parts[0], tail = parts[parts.length - 1];
    const joined = head + "/…/" + tail;
    if (joined.length <= max + 4) return joined;
    return "…/" + tail.slice(0, max - 2) + (tail.length > max - 2 ? "…" : "");
  }
  return name.slice(0, max - 1) + "…";
}

function agentRow(s, focused) {
  const u = s.usage || {};
  const known = u.context_window > 0 && u.context_used > 0;
  const cls = harnessClass(s.harness);
  const row = tag("div", "arow");
  if (focused) row.style.outline = "1px solid var(--separator)";

  const who = tag("div", "who " + cls);
  who.append(tag("i", "", "●"), document.createTextNode(s.alias || s.harness));
  who.style.color = colourOf(s.harness + ":" + s.id);
  who.append(tag("span", "model", " " + (u.model || (s.meta && s.meta.model) || s.harness)));
  row.append(who);

  if (known) {
    const bar = tag("div", "bar " + cls);
    const fillEl = document.createElement("span");
    fillEl.style.width = Math.min(100, (u.context_used / u.context_window) * 100) + "%";
    bar.append(fillEl);
    row.append(bar, tag("div", "num",
      Math.round((u.context_used / u.context_window) * 100) + "% of " + fmt(u.context_window) +
      " · " + fmt(Number(u.input_tokens || 0) + Number(u.output_tokens || 0)) + " tok"));
  } else {
    row.append(tag("div", "bar"), tag("div", "num unknown", "usage unknown"));
  }
  return row;
}

// ---- room panel ----
//
// Mirrors room.For: the working tree a session sits in, plus the repository
// that owns it when they differ.
function roomsOf(sess) {
  const repo = sess.repo;
  if (!repo) return sess.cwd ? [sess.cwd] : [];
  const lease = sess.pool && sess.pool.lease_id;
  const keys = [lease ? repo.root + "#" + lease : repo.root];
  if (repo.main_root && repo.main_root !== repo.root) keys.push(repo.main_root);
  return keys;
}

function roomName(key, home) {
  const path = key.split("#")[0];
  const rel = path.startsWith(home + "/") ? path.slice(home.length + 1) : path;
  return rel.split("/").filter(Boolean).slice(-1)[0] || rel;
}

function renderRooms() {
  const host = document.getElementById("rooms");
  const { entries, sessions, home } = VIEW;

  const byRoom = new Map();
  for (const e of entries) {
    if (!byRoom.has(e.room)) byRoom.set(e.room, []);
    byRoom.get(e.room).push(e);
  }
  const whoIn = new Map();
  for (const sess of sessions) {
    for (const key of roomsOf(sess)) {
      if (!whoIn.has(key)) whoIn.set(key, []);
      whoIn.get(key).push(sess.harness + ":" + sess.id);
    }
  }
  // A room with no posts but live agents still exists; a room with posts and no
  // agents is what the next arrival will be told.
  for (const key of whoIn.keys()) if (!byRoom.has(key)) byRoom.set(key, []);

  const byId = new Map(entries.map((e) => [e.id, e]));
  const rooms = [...byRoom.keys()].sort((a, b) =>
    roomName(a, home).localeCompare(roomName(b, home)) || a.localeCompare(b));

  if (!rooms.length) {
    host.replaceChildren(tag("div", "roomsempty", "No rooms yet."));
    return;
  }

  host.replaceChildren(...rooms.map((key) => {
    const posts = byRoom.get(key);
    const open = posts.filter(isOpen).length;
    const scope = posts.length ? posts[0].scope : "worktree";

    const box = document.createElement("details");
    box.className = "room";
    if (OPEN_ROOMS.has(key)) box.open = true;
    box.addEventListener("toggle", () => {
      box.open ? OPEN_ROOMS.add(key) : OPEN_ROOMS.delete(key);
    });

    const head = document.createElement("summary");
    const openButton = tag("button", "ropen");
    openButton.type = "button";
    openButton.title = "Open room documents in VS Code";
    openButton.setAttribute("aria-label", "Open " + roomName(key, home) + " room documents in VS Code");
    openButton.append(mark("folder"));
    openButton.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();
      openButton.disabled = true;
      openButton.classList.remove("failed");
      try {
        const response = await fetch(API + "/v1/rooms/open?room=" + encodeURIComponent(key), { method: "POST" });
        if (!response.ok) throw new Error("HTTP " + response.status);
      } catch (error) {
        openButton.classList.add("failed");
        openButton.title = "Could not open room documents";
        console.error(error);
      } finally {
        openButton.disabled = false;
      }
    });
    head.append(
      tag("span", "caret", "›"),
      tag("span", "rname", roomName(key, home)),
      tag("span", "rscope", scope),
      tag("span", "rcount"),
      openButton,
    );
    const count = head.querySelector(".rcount");
    if (open) count.append(tag("b", "", open + " open"), document.createTextNode(" · "));
    count.append(document.createTextNode(posts.length + (posts.length === 1 ? " post" : " posts")));
    box.append(head);

    const here = whoIn.get(key);
    if (here && here.length) {
      const line = tag("div", "rwho");
      here.forEach((k, i) => {
        if (i) line.append(document.createTextNode(", "));
        line.append(named(k));
      });
      box.append(line);
    }

    // Open first, then most recent: the same order the briefing reads in.
    const ordered = [...posts].sort((a, b) =>
      (isOpen(b) ? 1 : 0) - (isOpen(a) ? 1 : 0) || b.id - a.id);
    for (const e of ordered) {
      if (e.resolves) continue;  // answers are shown under what they answer
      box.append(postRow(e, byId));
    }
    return box;
  }));
}

function postRow(e, byId) {
  const row = tag("div", "post" + (isOpen(e) ? " open" : ""));
  const line = tag("div");
  line.append(tag("span", "pmode", e.mode), tag("span", "pbody", e.body));
  row.append(line);

  const answer = e.resolved_by && byId.get(e.resolved_by);
  if (answer) row.append(tag("div", "answer", answer.body));

  const meta = tag("div", "pmeta");
  meta.append(document.createTextNode("#" + e.id + " "), named(e.author));
  if (e.to) meta.append(document.createTextNode(" → "), named(e.to));
  meta.append(document.createTextNode(" · " + age(e.created_at)));
  row.append(meta);
  return row;
}

// An author keeps its hue wherever it is named.
function named(key) {
  const e = tag("span", "who-name", VIEW.authors.get(key) || key.split(":")[0]);
  if (VIEW.palette.has(key)) e.style.color = colourOf(key);
  return e;
}

function age(ts) {
  const then = Date.parse(ts);
  if (!then) return "";
  const secs = Math.max(0, (Date.now() - then) / 1000);
  if (secs < 60) return Math.floor(secs) + "s ago";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  return Math.floor(secs / 86400) + "d ago";
}

// ---- helpers ----

function isOpen(e) {
  return e.mode === "request" && !e.resolves && !e.resolved_by;
}

// The agent's own colour already says which agent; the vendor prefix is noise.
function shortModel(model) {
  if (!model) return "?";
  return model.split("[")[0].replace(/^claude-/, "");
}

function harnessClass(h) {
  return h === "claude" || h === "codex" ? h : "unknown";
}

function fmt(n) {
  return n >= 1e6 ? +(n / 1e6).toFixed(1) + "M" : Math.round(n / 1000) + "k";
}

function tag(name, cls, text) {
  const e = document.createElement(name);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function el(name, attrs = {}, text) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---- legend ----

function mark(kind, extra) {
  const svg = el("svg", { viewBox: "0 0 16 16", class: "licon" + (extra ? " " + extra : "") });
  for (const [t, a] of ICONS[kind]) svg.append(el(t, a));
  return svg;
}

function buildLegend() {
  const item = (glyph2, text) => {
    const s = tag("span", "litem");
    s.append(glyph2, tag("b", "", text));
    return s;
  };
  document.getElementById("legend").replaceChildren(
    item(mark("agent", "claude"), "claude"),
    item(mark("agent", "codex"), "codex"),
    item(mark("folder"), "folder · no repo"),
    item(mark("repo"), "repository"),
    item(mark("worktree"), "worktree"),
    item(mark("pool"), "pool slot"),
  );
}

// ---- controls ----

const usageBox = document.getElementById("opt-usage");
usageBox.checked = SHOW_USAGE;
usageBox.addEventListener("change", () => {
  SHOW_USAGE = usageBox.checked;
  remember("crew.usage", SHOW_USAGE ? "1" : "0");
  // Only the gauges and subtitles change, so the scene is rebuilt where it
  // stands rather than reheated.
  if (VIEW) { scene(); place(); resetPanel(); }
});

const labelBox = document.getElementById("opt-labels");
labelBox.checked = SHOW_LABELS;
document.body.classList.toggle("no-labels", !SHOW_LABELS);
labelBox.addEventListener("change", () => {
  SHOW_LABELS = labelBox.checked;
  remember("crew.labels", SHOW_LABELS ? "1" : "0");
  document.body.classList.toggle("no-labels", !SHOW_LABELS);
});

document.getElementById("reheat").addEventListener("click", () => {
  if (!SIM) return;
  KEEP.clear();
  placeNodes(SIM.nodes);
  reheat(1);
});
document.getElementById("recentre").addEventListener("click", recentre);

buildLegend();
initStage();
load().catch((err) => {
  document.getElementById("sub").textContent = "Failed to load: " + err.message;
});
setInterval(() => load().catch(() => {}), 2000);
</script>
</body>
