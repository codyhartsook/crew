name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - run: go vet ./...
      - run: sh -n scripts/install.sh
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
